<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="CloudKey UNAS architecture: browser to UniFi WebUI to genuine Ubiquiti userspace, over this project's identity and fix layer, to the custom kernel and Cloud Key hardware.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="380" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">

    <!-- Row A -->
    <rect x="28" y="22" width="448" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="49" font-size="14">Browser &#8212; UniFi WebUI / Drive UI (device web interface)</text>

    <!-- arrows -->
    <line x1="252" y1="66" x2="252" y2="76" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="252" y1="136" x2="252" y2="146" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="252" y1="206" x2="252" y2="216" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="252" y1="290" x2="252" y2="300" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Row B -->
    <rect x="28" y="80" width="448" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="105" font-size="14" font-weight="600">UniFi OS userspace &#8212; genuine Ubiquiti packages</text>
    <text x="44" y="125" font-size="12" fill="#57606a">unifi-core &#183; unifi-drive &#183; unifi-talk &#183; uos &#183; nginx</text>

    <!-- Row C -->
    <rect x="28" y="150" width="448" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="175" font-size="14" font-weight="600">Identity / fix layer (this project)</text>
    <text x="44" y="195" font-size="12" fill="#57606a">ubnt-tools wrapper &#183; frame-aware relay &#183; mount/mkfs wrappers &#183; /opt/ubnthal</text>

    <!-- Row D -->
    <rect x="28" y="220" width="448" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="245" font-size="14" font-weight="600">Custom 3.18.44-btrfscustom kernel</text>
    <text x="44" y="265" font-size="12" fill="#57606a">ubnthal &#183; ui_hdd_pwrctl_fake &#183; cloudkey-power &#183; fb_sp8110 &#183; leds-ulogo &#183; hci_smd</text>
    <text x="44" y="282" font-size="12" fill="#57606a">btrfs &#183; FUSE &#183; statx(2) backport</text>

    <!-- Row E -->
    <rect x="28" y="304" width="448" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="327" font-size="14" font-weight="600">Cloud Key Gen 2 Plus hardware (Qualcomm APQ8053)</text>
    <text x="44" y="344" font-size="12" fill="#57606a">USB/SATA disk &#183; btrfs storage pool</text>

    <!-- Callouts -->
    <line x1="476" y1="108" x2="494" y2="108" stroke="#0969da" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="496" y="80" width="196" height="56" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="510" y="103" font-size="12" fill="#0969da">unifi-core only enables</text>
    <text x="510" y="119" font-size="12" fill="#0969da">Drive for a NAS-class</text>
    <text x="510" y="135" font-size="12" fill="#0969da">hardware identity</text>

    <line x1="476" y1="255" x2="494" y2="255" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="496" y="220" width="196" height="70" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="510" y="247" font-size="12" fill="#1a7f37">Clean-room / ported GPL</text>
    <text x="510" y="263" font-size="12" fill="#1a7f37">drivers, built from</text>
    <text x="510" y="279" font-size="12" fill="#1a7f37">Ubiquiti&#8217;s GPL source</text>
  </g>
</svg>
